# Memos on the DSM app chassis. Read by chassis/build.sh and the tests.
PKG_NAME=memos
PKG_TITLE="Memos"
PKG_DESC="Memos, quick private notes you jot from any browser or phone, in Container Manager — with your notes kept on your Synology, attachments as plain files in the memos shared folder, and a DSM window for people and passwords (shown once), sign-ups, phone setup with a QR code, backups and updates."
APP_ID="Memos.AppInstance"
REPO=tombruton87/memos-dsm
SERVICES="server"
VOLUMES="data"
IMAGE_VARS="MEMOS_IMAGE"
PORT=5230
PORTS="5230 5231 5232 8230"
HEALTH_PATH=/healthz
APP_ACTIONS="useradd|userpw|setadmin|userdel|signups|uploadlimit"
APP_ANSWER_KEYS="ADMIN_USER"
APP_REQUEST_KEYS="MUSER ROLE LIMIT_MB"
TAGLINE="quick notes"
WELCOME="Memos is a place for quick notes: thoughts, links, lists and photos, jotted down in a second and found again by tag or search. Your notes stay on your Synology, and the files you attach are ordinary files in a shared folder. This package runs Memos in Container Manager, makes your account and adds a Memos window to DSM for people, phones and backups."
BACKUP_WHAT="every memo and account (a consistent copy of Memos's SQLite database) and every attached file in <code>attachments/</code>."
SITE_NOTE="Browsers and phones reach Memos at this address, and Memos uses it for the links it makes. For use away from home it must be reachable from outside: DSM's reverse proxy with a domain and HTTPS (steps below) is the usual way. Phones only install Memos as an app from an HTTPS address."
ICON_TOP="#2d2f63"
ICON_BOTTOM="#121330"
ICON_LETTER="M"   # only if icon.png is missing
BETA=yes
